name: Redirect the old CLI site

# Manual, once the sldev site is live on Vercel: the CLI's pages moved from GitHub Pages on the downloads repo
# (https://ben42-01.github.io/downloads.sldev.io/) into the sldev site at /cli. This replaces the `gh-pages`
# branch of the downloads repo with two small pages that send visitors (and old /commands/ links) there.
# It uses the RELEASES_TOKEN secret (Contents read/write on the downloads repo) and touches only gh-pages.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOWNLOADS_REPO: ben42-01/downloads.sldev.io

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the redirect pages
        run: |
          SITE=$(node -p "require('./website/src/content/site.json').url")
          page() { # <target>
            printf '<!doctype html><meta charset="utf-8"><title>sldev CLI</title><link rel="canonical" href="%s"><meta http-equiv="refresh" content="0; url=%s"><p>The sldev CLI moved to <a href="%s">%s</a>.</p>\n' "$1" "$1" "$1" "$1"
          }
          mkdir -p out/commands
          page "$SITE/cli/" > out/index.html
          page "$SITE/cli/commands/" > out/commands/index.html
          cp out/index.html out/404.html
          touch out/.nojekyll
      - name: Push to the downloads repo
        working-directory: out
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::RELEASES_TOKEN secret is missing"; exit 1; }
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Redirect to the sldev site's /cli"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${DOWNLOADS_REPO}.git"
          git push --force origin HEAD:refs/heads/gh-pages
