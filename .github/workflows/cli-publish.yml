name: Publish CLI

# Manual: builds the free sldev CLI and pushes it as a tiny standalone package (package.json, README,
# LICENSE, SKILL.md and the built dist/sldev.mjs) to the `cli` branch of the PUBLIC downloads repo, tagged
# cli-v<version>. npm can install a git branch but not a subfolder, and the source repo is private, so:
#
#   npm i -g github:ben42-01/downloads.sldev.io#cli            # newest
#   npm i -g github:ben42-01/downloads.sldev.io#cli-v0.1.0     # pinned
#
# It uses the RELEASES_TOKEN secret (Contents read/write on the downloads repo), like the app release.
# It touches only that branch and tag: no GitHub release, so the app's updater and /download never see it.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOWNLOADS_REPO: ben42-01/downloads.sldev.io

concurrency:
  group: cli-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run cli/test
      - run: npm run cli:build
      - name: Assemble the package
        run: |
          mkdir -p cli-pkg/dist
          cp cli/package.json cli/README.md cli/LICENSE cli/SKILL.md cli-pkg/
          cp cli/dist/sldev.mjs cli-pkg/dist/
          (cd cli-pkg && npm pack --dry-run)
      - name: Push to the downloads repo
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::RELEASES_TOKEN secret is missing (see docs/go-to-production.md)"; exit 1; }
          VERSION=$(node -p "require('./cli/package.json').version")
          cd cli-pkg
          git init -q -b cli
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "sldev CLI $VERSION (from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
          git tag -f "cli-v$VERSION"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${DOWNLOADS_REPO}.git"
          git push --force origin cli "cli-v$VERSION"
          echo "Installed with: npm i -g github:${DOWNLOADS_REPO}#cli-v$VERSION" >> "$GITHUB_STEP_SUMMARY"
