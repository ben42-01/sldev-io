name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run cli:build

  # the CLI on Windows: named pipe, ConPTY, .cmd shims and cmd.exe, against Windows twins of the fake agents
  cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p cli/tsconfig.json
      - run: npx vitest run cli/test
      - run: npm run cli:build
      - run: node cli/dist/sldev.mjs help

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  # the free CLI's home page builds alone (cli-site.yml deploys it by hand); a broken site fails here first
  cli-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli-site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CLI_SITE_BASE: /downloads.sldev.io/
