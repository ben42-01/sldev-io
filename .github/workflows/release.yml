name: Release

# Push to a release branch (release/0.2.0, release/next, …) to build installers for every OS
# and publish them on a GitHub release tagged v<package.json version>:
#   - in the PUBLIC downloads repo (what users and the website download), using the
#     RELEASES_TOKEN secret (fine-grained token: Contents read/write on that repo only)
#   - in this private repo too, with generated notes, as an internal record
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      mac:
        description: Build macOS too
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOWNLOADS_REPO: ben42-01/downloads.sldev.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip macOS when not requested
        if: matrix.name == 'macos' && github.event_name == 'workflow_dispatch' && !inputs.mac
        run: echo "skip=1" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v4
        if: env.skip != '1'
      - uses: actions/setup-node@v4
        if: env.skip != '1'
        with:
          node-version: 22
          cache: npm
      - name: Install rpm tooling
        if: env.skip != '1' && matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
        if: env.skip != '1'
      - run: npm run build
        if: env.skip != '1'
      - name: Package
        if: env.skip != '1'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # unsigned builds until signing secrets (CSC_LINK, APPLE_ID, …) are configured
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        if: env.skip != '1'
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish to the public downloads repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: ${{ env.DOWNLOADS_REPO }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN secret is missing (see docs/go-to-production.md, Phase 1)"
            exit 1
          fi
          # versions like 0.2.0-beta.1 are published as pre-releases and never become "Latest"
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          cat > notes.md <<EOF
          Download the installer for your system below.

          | System | File |
          |---|---|
          | Windows | \`.exe\` |
          | macOS (Apple Silicon) | \`-arm64.dmg\` |
          | macOS (Intel) | \`.dmg\` without \`arm64\` |
          | Linux | \`.AppImage\` (any distro), \`.deb\` (Debian/Ubuntu), \`.rpm\` (Fedora/RHEL) |

          Builds are not code-signed yet: on Windows choose **More info → Run anyway**; on macOS
          right-click the app and choose **Open** the first time. Checksums are in \`SHA256SUMS.txt\`.

          More at https://sldev.io
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # the downloads repo has no source, so the tag points at its default branch
            gh release create "$TAG" dist/* --title "sldev-io $TAG" --notes-file notes.md $PRE
          fi

      - name: Record the release in this repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "sldev-io $TAG" --generate-notes $PRE
          fi
