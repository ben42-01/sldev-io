appId: io.sldev.app
productName: sldev-io
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
# The AppImage's static runtime (toolset 1.x) needs no libfuse2, which Ubuntu 24.04 no longer ships, and
# its AppRun adds --no-sandbox only where unprivileged user namespaces are blocked (AppArmor on 24.04+).
toolsets:
  appimage: '1.0.3'
linux:
  # AppImage: the recommended Linux install (install.sh puts it in ~/Applications); it replaces its own
  # file on update, so no password. deb: system-wide under /opt, so updating it asks for the admin password.
  target: [AppImage, deb]
  # one PNG per hicolor size; the theme has no 1024x1024 folder, so a single big icon is ignored
  icon: build/icons
  # window icon at runtime (also covers running the unpacked build without a .desktop entry)
  extraResources:
    - from: build/icons/512x512.png
      to: icon.png
  syncDesktopName: true
  category: Development
  maintainer: sldev-io
deb:
  # apt installs recommends by default; everything else is offered by the in-app setup check
  recommends: [git, libappindicator3-1]
mac:
  # the zip is only for auto-update (Squirrel.Mac and latest-mac.yml); people download the dmg
  target: [dmg, zip]
  # name the arch on both builds so api/download.ts can tell them apart
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
win:
  target: [nsis]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
# Where installers are published (by the release workflow, not by electron-builder itself:
# it runs with --publish never). This bakes the location into the app for electron-updater
# (src/main/updater.ts) and writes the update metadata it reads (latest*.yml, .blockmap).
publish:
  provider: github
  owner: ben42-01
  repo: sldev-io
