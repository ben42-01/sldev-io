appId: io.sldev.app
productName: sldev-io
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
linux:
  target: [AppImage, deb, rpm]
  syncDesktopName: true
  category: Development
  maintainer: sldev-io
deb:
  # apt installs recommends by default; everything else is offered by the in-app setup check
  recommends: [git, libappindicator3-1]
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: true
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
