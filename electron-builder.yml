appId: io.sldev.app
productName: sldev-io
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
linux:
  target: [AppImage, deb, rpm]
  # one PNG per hicolor size; the theme has no 1024x1024 folder, so a single big icon is ignored
  icon: build/icons
  # window icon at runtime (AppImages have no installed .desktop entry to take it from)
  extraResources:
    - from: build/icons/512x512.png
      to: icon.png
  syncDesktopName: true
  category: Development
  maintainer: sldev-io
deb:
  # apt installs recommends by default; everything else is offered by the in-app setup check
  recommends: [git, libappindicator3-1]
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: true
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Where installers are published (by the release workflow, not by electron-builder itself:
# it runs with --publish never). This makes the build write the update metadata (latest*.yml /
# beta*.yml) and bakes the location into the app for auto-update.
publish:
  provider: github
  owner: ben42-01
  repo: downloads.sldev.io
